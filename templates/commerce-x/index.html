<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Commerce X — Template Comercial Multi-Nicho Premium</title>
    <meta name="description" content="Commerce X: template comercial multi-nicho com e-commerce, carrinho, catálogo de produtos e tema adaptativo. Escolha seu nicho e veja a mágica acontecer.">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/animacoes.css">
    <link rel="stylesheet" href="css/selecao.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<base target="_blank">
</head>
<body class="page-index">
    <!-- Botão Voltar ao Portfólio -->
    <a href="../../index.html" class="voltar-portfolio" title="Voltar ao portfólio JoveModerno">
        <i class="fas fa-arrow-left"></i>
        Portfólio
    </a>

    <div class="particles-bg" id="particlesBg"></div>

    <header class="hero-select">
        <div class="hero-badge">✨ Jovemoderno apresenta</div>
        <h1 class="hero-title">
            <span class="gradient-text">Commerce X</span>
        </h1>
        <p class="hero-subtitle">
            Um template. <strong>Infinitas possibilidades.</strong><br>
            Escolha seu nicho e veja a mágica acontecer.
        </p>
        <div class="scroll-hint">
            <span>Role para escolher</span>
            <i class="fas fa-chevron-down bounce"></i>
        </div>
    </header>

    <main class="niche-grid" id="nicheGrid">
        <!-- Populado via JS -->
    </main>

    <div class="preview-modal" id="previewModal">
        <div class="preview-content">
            <span class="preview-close" id="previewClose">&times;</span>
            <div class="preview-icon" id="previewIcon"></div>
            <h2 id="previewTitle"></h2>
            <p id="previewDesc"></p>
            <div class="preview-colors" id="previewColors"></div>
            <button class="btn-premium pulse" id="previewBtn">
                <span>Ver Demonstração</span>
                <i class="fas fa-arrow-right"></i>
            </button>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/transicoes.js"></script>
    <script src="js/router.js"></script>
    <script src="js/selecao.js"></script>
</body>
</html>
