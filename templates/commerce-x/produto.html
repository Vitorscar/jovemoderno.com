<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Commerce X — Produto</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/animacoes.css">
    <link rel="stylesheet" href="css/produto.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="page-produto">
    <nav class="navbar glass" id="navbar">
        <div class="nav-left">
            <a href="nicho.html" class="nav-back">
                <i class="fas fa-arrow-left"></i> <span>Voltar</span>
            </a>
            <span class="nav-logo-sm">Commerce<span class="logo-highlight">X</span></span>
        </div>
        <div class="nav-right">
            <button class="btn-icon theme-toggle" id="themeToggle" title="Modo escuro">
                <i class="fas fa-moon"></i>
            </button>
            <button class="btn-icon cart-trigger" id="cartTriggerProd" title="Carrinho">
                <i class="fas fa-shopping-bag"></i>
                <span class="cart-badge pulse-badge" id="cartBadgeProd">0</span>
            </button>
        </div>
    </nav>

    <main class="produto-main" id="produtoMain">
        <div class="produto-skeleton">
            <div class="skeleton-gallery"></div>
            <div class="skeleton-info">
                <div class="skeleton-line w-60"></div>
                <div class="skeleton-line w-40"></div>
                <div class="skeleton-line w-80"></div>
                <div class="skeleton-line w-30"></div>
            </div>
        </div>
    </main>

    <aside class="cart-sidebar glass-heavy" id="cartSidebarProd">
        <div class="cart-header">
            <h3><i class="fas fa-shopping-bag"></i> Carrinho</h3>
            <button class="btn-close-cart" id="closeCartProd">&times;</button>
        </div>
        <div class="cart-items" id="cartItemsProd">
            <p class="cart-empty">Seu carrinho está vazio.</p>
        </div>
        <div class="cart-footer" id="cartFooterProd" style="display:none;">
            <div class="cart-total">
                <span>Total</span>
                <span id="cartTotalProd">R$ 0,00</span>
            </div>
            <a href="carrinho.html" class="btn-premium full-width">Ver Carrinho</a>
        </div>
    </aside>
    <div class="cart-overlay" id="cartOverlayProd"></div>
    <div class="toast" id="toast"></div>

    <script src="js/data.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/transicoes.js"></script>
    <script src="js/router.js"></script>
    <script src="js/produto.js"></script>
</body>
</html>
