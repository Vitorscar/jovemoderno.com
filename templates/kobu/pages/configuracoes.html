<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações — Kobu</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="app-body">
    <div id="sidebar-container"></div>
    <main class="main-content">
        <header class="topbar">
            <button id="sidebar-toggle" class="btn-icon" aria-label="Menu">☰</button>
            <h1 class="page-title">Configurações</h1>
        </header>
        <div class="content-area">
            <form id="config-form" class="card config-card">
                <h2>Dados do Usuário</h2>
                <div class="form-group">
                    <label for="user-nome">Nome</label>
                    <input type="text" id="user-nome" class="input-text" placeholder="Seu nome">
                </div>
                <div class="form-group">
                    <label for="user-email">E-mail</label>
                    <input type="email" id="user-email" class="input-text" placeholder="seu@email.com">
                </div>
                <div class="form-group">
                    <label for="user-telefone">Telefone</label>
                    <input type="tel" id="user-telefone" class="input-text" placeholder="(00) 00000-0000">
                </div>
                <div class="form-group">
                    <label for="user-clinica">Clínica Veterinária Favorita</label>
                    <input type="text" id="user-clinica" class="input-text" placeholder="Nome da clínica">
                </div>
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="user-notificacoes">
                    <label for="user-notificacoes">Ativar lembretes de vacinas e agendamentos</label>
                </div>
                <button type="submit" class="btn-primary">Salvar Configurações</button>
            </form>
            <div class="card config-card" style="margin-top: 20px;">
                <h2>Dados do Sistema</h2>
                <p>Seus dados são armazenados localmente no navegador (LocalStorage).</p>
                <button id="btn-exportar-dados" class="btn-secondary" style="margin-top: 10px;">📥 Exportar Dados</button>
                <button id="btn-limpar-dados" class="btn-danger" style="margin-top: 10px; margin-left: 10px;">🗑 Limpar Todos os Dados</button>
            </div>
        </div>
    </main>
    <div id="toast-container"></div>
    <script src="../js/storage.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const usuario = Storage.getUsuario();
            document.getElementById('user-nome').value = usuario.nome || '';
            document.getElementById('user-email').value = usuario.email || '';
            document.getElementById('user-telefone').value = usuario.telefone || '';
            document.getElementById('user-clinica').value = usuario.clinicaFavorita || '';
            document.getElementById('user-notificacoes').checked = usuario.notificacoes || false;

            document.getElementById('config-form').addEventListener('submit', (e) => {
                e.preventDefault();
                const dados = {
                    nome: document.getElementById('user-nome').value,
                    email: document.getElementById('user-email').value,
                    telefone: document.getElementById('user-telefone').value,
                    clinicaFavorita: document.getElementById('user-clinica').value,
                    notificacoes: document.getElementById('user-notificacoes').checked
                };
                Storage.setUsuario(dados);
                UI.showToast('Configurações salvas!', 'success');
            });

            document.getElementById('btn-exportar-dados').addEventListener('click', () => {
                const dados = {
                    pets: Storage.getPets(),
                    agendamentos: Storage.getAgendamentos(),
                    usuario: Storage.getUsuario()
                };
                const blob = new Blob([JSON.stringify(dados, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'kobu-backup.json';
                a.click();
                UI.showToast('Dados exportados!', 'success');
            });

            document.getElementById('btn-limpar-dados').addEventListener('click', () => {
                UI.showConfirm('Tem certeza que deseja limpar TODOS os dados? Esta ação não pode ser desfeita.', () => {
                    localStorage.clear();
                    UI.showToast('Dados limpos. Recarregue a página.', 'warning');
                });
            });
        });
    </script>
</body>
</html>
