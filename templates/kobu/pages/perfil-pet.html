<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil do Pet — Kobu</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="app-body">
    <div id="sidebar-container"></div>
    <main class="main-content">
        <header class="topbar">
            <button id="sidebar-toggle" class="btn-icon" aria-label="Menu">☰</button>
            <h1 class="page-title">Perfil do Pet</h1>
            <a href="pets.html" class="btn-secondary">← Voltar</a>
        </header>
        <div class="content-area" id="perfil-content">
            <div class="loading-spinner">Carregando perfil...</div>
        </div>
    </main>
    <div id="modal-container"></div>
    <div id="toast-container"></div>
    <script src="../js/storage.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/pets.js"></script>
    <script src="../js/app.js"></script>
    <script>
        // Inicialização específica do perfil
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const petId = params.get('id');
            if (petId && typeof renderizarPerfilPet === 'function') {
                renderizarPerfilPet(petId);
            } else {
                document.getElementById('perfil-content').innerHTML =
                    '<div class="empty-state">Pet não encontrado. <a href="pets.html">Voltar para lista</a></div>';
            }
        });
    </script>
</body>
</html>
